[package]
name = "nanobot-rs"
version = "0.1.0"
edition = "2021"
authors = ["wimdaw"]
description = "Ultra-lightweight, high-performance personal AI agent framework in Rust (Refactored from HKUDS/nanobot)"
license = "MIT"

[[bin]]
name = "nanobot"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive"] }
async-trait = "0.1"
futures = "0.3"
eventsource-stream = "0.2"
axum = { version = "0.7", features = ["macros"] }
async-stream = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.0"
tokio-tungstenite = { version = "0.24", features = ["connect", "handshake", "native-tls"] }
regex = "1.10"
walkdir = "2.5"
sha2 = "0.10"
hex = "0.4"
anyhow = "1.0"
thiserror = "1.0"
